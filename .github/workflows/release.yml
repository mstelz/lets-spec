name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # A release bumps version in lets/package.json in the commit it tags.
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(jq -r .version lets/package.json)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "The tag $TAG does not match version $version in lets/package.json. Bump the version in the commit you tag." >&2
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build the release folder
        run: nix build .#dist

      # The tag v0.1.0 makes the folder lets-spec-0.1.0.
      - name: Make the tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="lets-spec-${TAG#v}"
          cp -rL result "$name"
          chmod -R u+w "$name"
          tar czf "$name.tar.gz" "$name"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="lets-spec-${TAG#v}"
          openspec="$(jq -r .openspec "$name/release.json")"
          gh release create "$TAG" "$name.tar.gz" --generate-notes --notes "OpenSpec CLI: $openspec"
